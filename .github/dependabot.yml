version: 2

updates:
  # Dependências e plugins Maven.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Um PR só para o ecossistema Spring — as versões andam juntas.
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      testes:
        patterns:
          - "org.testcontainers*"
          - "org.junit*"
      aws:
        patterns:
          - "software.amazon.awssdk*"

  # Actions usadas nos workflows: manter atualizado é parte da superfície de ataque.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Fortaleza
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

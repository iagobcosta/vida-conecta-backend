name: CD

# Publica a imagem no Docker Hub. Só roda depois que a CI passa em main, em
# tags de release, ou sob demanda — nunca em PR de terceiros.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Prepare — resolve o commit certo, a versão e as tags finais uma única
  #    vez. Os jobs de build (em matriz) só recebem esse resultado pronto.
  # ---------------------------------------------------------------------------
  prepare:
    name: Preparar publicação
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      image: ${{ vars.DOCKERHUB_USERNAME }}/vida-conecta-backend
    steps:
      # Para o gatilho workflow_run, github.sha aponta para o commit do próprio
      # cd.yml, não para o commit que a CI verificou — por isso resolvemos e
      # fazemos checkout explícito do head_sha da execução da CI que passou.
      - name: Resolver o commit a publicar
        id: commit
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout do commit verificado pela CI
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}

      # Lê o <version> de primeiro nível do pom.xml (não confundir com a versão
      # de alguma dependência) e descarta o sufixo (ex.: "-SNAPSHOT"), deixando
      # só a parte numérica como tag — ex.: "1.1.1-SNAPSHOT" vira "1.1.1".
      - name: Extrair a versão do projeto (pom.xml)
        id: version
        run: |
          set -euo pipefail
          numerica=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          versao = ET.parse("pom.xml").getroot().find("m:version", ns).text
          print(versao.split("-")[0])
          PY
          )
          echo "Versão do pom.xml -> tag: $numerica"
          echo "version=$numerica" >> "$GITHUB_OUTPUT"

      - name: Calcular tags e metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/vida-conecta-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

  # ---------------------------------------------------------------------------
  # 2. Build — uma perna por arquitetura, cada uma num runner NATIVO daquela
  #    arquitetura (sem QEMU: compilar Java sob emulação é muito mais lento).
  #    Cada perna escaneia sua própria imagem com Trivy antes de publicar, e
  #    publica só o digest (sem tag ainda) — a tag final só existe depois que
  #    as duas pernas passarem e o job de merge juntar os dois digests.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout do commit verificado pela CI
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Carregado no daemon local (runner nativo dessa arquitetura, sem
      # emulação) para escanear ANTES de publicar. O cache local do BuildKit
      # já populado aqui é reaproveitado no build de push logo abaixo, então
      # buildar duas vezes não recompila nada na prática.
      - name: Build local para escaneamento prévio
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: vida-conecta-backend:scan
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Inventariar CVEs da imagem (relatório)
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --no-progress --format table \
            vida-conecta-backend:scan | tee trivy-image.txt
          {
            echo "### Vulnerabilidades HIGH/CRITICAL na imagem (${{ matrix.platform }})"
            echo
            echo '```'
            cat trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Barrar CVEs CRITICAL com correção disponível
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL --ignore-unfixed --no-progress --exit-code 1 \
            vida-conecta-backend:scan

      # Publica só o digest, sem tag — a tag final é aplicada no job de merge,
      # depois que as duas arquiteturas passarem no scan.
      - name: Publicar por digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: true
          sbom: true
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Exportar o digest para o job de merge
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Publicar o digest como artefato
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. Merge — junta os dois digests num manifest list multi-arquitetura e
  #    aplica as tags finais. Não recompila nada: só combina o que as duas
  #    pernas já publicaram.
  # ---------------------------------------------------------------------------
  merge:
    name: Publicar manifest multi-arquitetura
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar os digests das duas arquiteturas
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Criar e publicar o manifest multi-arquitetura
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=("-t" "$tag")
          done <<<"$TAGS"
          digest_refs=()
          for digest in *; do
            digest_refs+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"

      - name: Resumo da publicação
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Imagem publicada"
            echo
            echo "Plataformas: \`linux/amd64\`, \`linux/arm64\`"
            echo
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "<details><summary>Manifest</summary>"
            echo
            echo '```'
            docker buildx imagetools inspect "$IMAGE:latest"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Deploy — manda o EC2 puxar a tag `latest` recém-publicada e recriar o
  # container da API. Roda via AWS Systems Manager (SSM Run Command): sem SSH
  # exposto, sem chave privada em Secret. O GitHub Actions assume uma IAM role
  # via OIDC (nenhuma credencial de longa duração fica gravada no repositório).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy no EC2 via SSM
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar credenciais AWS (OIDC, sem chave de longa duração)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # O script fica versionado no repo (deploy/ec2-deploy.sh) em vez de
      # mantido manualmente na instância — assim o próprio EC2 sempre roda a
      # versão do script que está em main, sem drift entre repo e servidor.
      # O comando embutido não carrega segredo nenhum: o script lê as env vars
      # do container atual na própria instância antes de recriá-lo.
      # O AWS-RunShellScript sempre executa via /bin/sh da instância — em
      # Amazon Linux isso é bash, mas em Ubuntu (e outras distros) é dash, que
      # não entende array nem nameref. O shebang do ec2-deploy.sh não tem
      # nenhum efeito aqui, porque a SSM não roda o conteúdo como um arquivo
      # executável. Por isso escrevemos o script num arquivo via heredoc (sh
      # puro, sem problema) e chamamos "bash" nele explicitamente.
      - name: Enviar o comando de deploy via SSM
        id: enviar
        run: |
          set -euo pipefail
          {
            echo "export DEPLOY_IMAGE=${{ vars.DOCKERHUB_USERNAME }}/vida-conecta-backend:latest"
            echo "export DEPLOY_CONTAINER=vida-conecta-api"
            echo 'cat <<"EOF_VIDA_CONECTA_DEPLOY" > /tmp/vida-conecta-deploy.sh'
            cat deploy/ec2-deploy.sh
            echo 'EOF_VIDA_CONECTA_DEPLOY'
            echo 'bash /tmp/vida-conecta-deploy.sh'
          } > /tmp/ssm-commands.txt

          COMMANDS_JSON=$(jq -Rsc 'split("\n")' /tmp/ssm-commands.txt)

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --comment "Deploy vida-conecta-backend via GitHub Actions (run ${{ github.run_id }})" \
            --parameters "{\"commands\":$COMMANDS_JSON}" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Command ID: $COMMAND_ID"

      - name: Aguardar o resultado do deploy
        env:
          COMMAND_ID: ${{ steps.enviar.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $status"
            case "$status" in
            Success)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              exit 0
              ;;
            Failed | Cancelled | TimedOut)
              echo "::error::Deploy no EC2 falhou (status: $status)."
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text >&2
              exit 1
              ;;
            esac
            sleep 5
          done
          echo "::error::Timeout aguardando o resultado do comando SSM."
          exit 1

name: Pull request

# Validações que só fazem sentido no contexto de um PR: título, tamanho da
# mudança e dependências novas entrando no projeto.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  titulo:
    name: Título em Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # O merge é por squash: o título do PR vira a mensagem do commit em main.
      - name: Validar o título
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            O assunto "{subject}" deve começar em minúscula, no imperativo.
            Ex.: "feat: adiciona cancelamento de consulta pelo médico".

  dependencias:
    name: Revisão de dependências novas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verificar suporte ao Dependency graph
        id: dependency_graph
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('GET /repos/{owner}/{repo}/dependency-graph/sbom', {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 403 || error.status === 404) {
                core.warning('Dependency graph indisponível neste repositório; pulando dependency-review.');
                core.setOutput('enabled', 'false');
              } else {
                throw error;
              }
            }

      - name: Checkout
        uses: actions/checkout@v4

      # Compara o grafo de dependências do PR com o de main e barra CVE conhecida
      # ou licença incompatível chegando junto com a mudança.
      - name: Revisar dependências
        if: steps.dependency_graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0, GPL-3.0
